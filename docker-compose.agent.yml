version: '3.8'
services:
  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    env_file:
      - .env.ai
    ports:
      - '3001:3001'
    depends_on:
      - postgres
      - redis
      - ollama

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env.ai
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ollama:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  ollama:
